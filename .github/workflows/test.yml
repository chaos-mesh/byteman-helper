name: Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Test with Maven
        run: |
          cd BytemanHelper
          mvn package
          cd ..
          cd ChaosAgent
          mvn package
          cd ..
          cd AgentInstaller
          mvn package
